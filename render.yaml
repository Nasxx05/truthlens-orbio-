services:
  - type: web
    name: trustlens-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Set these in the Render dashboard — never commit secrets.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Only needed if LLM_PROVIDER=openai — e.g. to reach an OpenAI-compatible
      # proxy like OpenRouter with a proxy key instead of a genuine OpenAI key.
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: LOG_FORMAT
        value: json
      # Everything else (scrape budgets, filtering, rate limits, cache/queue)
      # has a safe default in app/config.py and only needs an override if you
      # add Postgres/Redis add-ons or want to tune behavior — see
      # backend/.env.example for the full list.
